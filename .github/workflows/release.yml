name: Release

# Creates the vX.Y.Z tag and GitHub Release whenever package.json's version
# changes on main (i.e. a release PR is merged). Ordinary merges are no-ops
# because the version guard skips versions that already have a release.
#
# Split into two jobs so dependency code never runs where the write token
# exists: `build` installs and runs everything read-only; `release` waits for
# approval of the `release` environment, installs nothing, and publishes the
# prebuilt files.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      released: ${{ steps.v.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Determine version and whether it is already released
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already released, skipping."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $TAG."
          fi

      - name: Install dependencies
        if: steps.v.outputs.released == 'false'
        run: npm ci --ignore-scripts

      - name: Verify and bundle
        if: steps.v.outputs.released == 'false'
        run: |
          npm run lint
          npm run bundle

      - name: Upload bundle
        if: steps.v.outputs.released == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec
          path: dist/
          retention-days: 1

  release:
    needs: build
    # Only when there is a new version, so ordinary merges don't wait for approval.
    if: needs.build.outputs.released == 'false'
    # Requires a maintainer's approval before this job (and its write token)
    # runs, so a stolen GitHub login can't publish a release on its own.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag + GitHub Release
    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spec
          path: dist/

      # Idempotent: creates the tag and Release only if missing. --target
      # creates the tag at this commit through the API, so no git credentials
      # are needed.
      - name: Ensure release tag and GitHub Release exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" dist/openapi.json dist/openapi.yaml \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for details."
          fi
