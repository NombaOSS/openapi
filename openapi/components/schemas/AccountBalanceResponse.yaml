type: object
properties:
  amount:
    type: string
    description: Account balance
    example: '281946.0'
  currency:
    type: string
    description: Currency code
    minLength: 3
    maxLength: 3
    enum:
      - NGN
    example: NGN
  timeCreated:
    type: string
    format: date-time
    description: Account creation timestamp
    example: '2026-03-08T14:56:59.000Z'
required:
  - amount
  - currency
  - timeCreated
