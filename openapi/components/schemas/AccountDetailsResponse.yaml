type: object
properties:
  createdAt:
    type: string
    description: Creation timestamp
    format: date-time
    example: '2023-09-04T07:09:06.900Z'
  accountId:
    type: string
    description: Account ID
    minLength: 36
    maxLength: 36
    example: fc81b80e-e607-4b86-8591-840925191733
  accountHolderId:
    type: string
    description: Account holder ID
    minLength: 36
    maxLength: 36
    example: 01a10aeb-d989-460a-bbde-9842f2b4320f
  accountRef:
    type: string
    description: Account reference
    minLength: 16
    maxLength: 64
    example: 1oWbJQQHLyQqqf1SwxjSpudeA21
  bvn:
    type: string
    description: Bank Verification Number (BVN)
    minLength: 11
    maxLength: 11
    example: '12234412345'
  status:
    type: string
    description: Account status
    enum:
      - ACTIVE
      - INACTIVE
      - SUSPENDED
      - PND
      - BLACKLISTED
    example: ACTIVE
  type:
    type: string
    description: Account type
    enum:
      - virtual
      - outlet
    example: virtual
  accountName:
    type: string
    description: Account holder's name
    minLength: 8
    maxLength: 64
    example: Daniel Scorsese
  currency:
    type: string
    description: Currency code
    minLength: 3
    maxLength: 3
    enum:
      - NGN
    example: NGN
  banks:
    type: array
    description: List of associated bank accounts
    items:
      type: object
      properties:
        bankAccountNumber:
          type: string
          description: Bank account number
          example: '93910'
        bankName:
          type: string
          description: Bank name
          example: Sterling Bank
        bankAccountName:
          type: string
          description: Bank account holder name
          example: Nomba/Ifeoluwa Adeboye
      required:
        - bankAccountNumber
        - bankName
        - bankAccountName
required:
  - createdAt
  - accountId
  - accountHolderId
  - accountRef
  - bvn
  - status
  - type
  - accountName
  - banks
  - currency
