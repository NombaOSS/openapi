type: object
properties:
  id:
    type: string
    description: Unique identifier of the airtime transaction
    example: API-TOPUP-A6950-8c060b7c-4155-4e33-a846-101b49229c33
  status:
    type: string
    description: >-
      Status of the transaction. `SUCCESS` (HTTP 200) means the purchase
      completed; `PENDING_BILLING` (HTTP 201) means it is still being processed.


      In addition, any undocumented `data.status` should be treated as
      `PENDING_BILLING`; listen for the webhook or requery the transaction for
      its final status.
    example: SUCCESS
  type:
    type: string
    description: Transaction type
    example: topup
  amount:
    type: number
    format: double
    description: Airtime amount purchased
    example: 100
  source:
    type: string
    description: Channel through which the transaction was initiated
    example: api
  sourceUserId:
    type: string
    description: Identifier of the source user, if any
    nullable: true
  customerBillerId:
    type: string
    description: Phone number credited with the airtime
    example: '08123456788'
  productId:
    type: string
    description: Product identifier for the airtime purchase
    example: '62130'
  meta:
    type: object
    description: Additional transaction metadata
    additionalProperties: true
    example:
      api_rrn: '260926204701'
      rrn: '260926204701'
      api_account_id: 0167288-d989-460a-bbde-9842f2b4320f
      api_client_id: 2167288-d989-460a-bbde-9842f2b4320f
      user_id: 0167288-d989-460a-bbde-9842f2b4320f
      merchantTxRef: REF-29-07-2026-12
      allowDuplicate: true
      sender_name: John Doe
      idempotentKey: 0167288-d989-460a-bbde-9842f2b4320f_REF-29-07-2026-12
      pos_withdrawal_id: 0167288-d989-460a-bbde-9842f2b4320f_REF-29-07-2026-12
      userName: John Doe
      isCorporate: 'true'
      currency: NGN
      hooksEligible: 'true'
      isSubscribedToSavingsService: false
      isSubscribedToLoanService: false
      txnAlertEligible: true
      banking_entity_id: 189585760
      banking_entity_user_id: 188595905
      banking_entity_type: CORPORATE
      transactionCategory: Bills & Utility
      network: mtn
      subscriberNumber: '08123456788'
      amount_charged: '100.0'
      wallet_balance: '610.55'
      wallet_currency: NGN
      agent_commission: '2.0'
      gatewayMessage: Success
      billingServiceTransactionId: 6ab821352669ea6eac2bb2ba
      billingServiceResponse: SUCCESS
      income: '0.5'
      paymentFee: 0
      tx_revenue: '2.5'
      phoneNumber: '08123456788'
  userId:
    type: string
    description: Identifier of the user, if any
    nullable: true
  timeCreated:
    type: string
    description: Time the transaction was created
    format: date-time
    example: '2026-09-26T19:47:01.514+00:00'
required:
  - id
  - status
  - type
  - amount
  - timeCreated
