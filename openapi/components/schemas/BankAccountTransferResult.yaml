type: object
properties:
  amount:
    type: string
    description: Amount to be transfer
    example: '1.0'
  source:
    type: string
    description: Trnsfer source could be web, api etc..
    example: api
  sourceUserId:
    type: string
    description: Source user ID
    example: 11ec45a1-1fe5-44f5-8baf-cxxxxxxxxxx
  customerBillerId:
    type: string
    description: Customer biller ID
    example: 010784xxxx
  productId:
    type: string
    description: A unique number for the product
    example: '058'
  meta:
    $ref: ./BankAccountTransferMetaObject.yaml
  fee:
    type: number
    format: double
    description: Transfer fee
    example: 50
  timeCreated:
    type: string
    format: date-time
    description: Creation timestamp
    example: '2026-03-08T14:17:13.634Z'
  id:
    type: string
    description: Transfer ID
    example: API-TRANSFER-C24AD-a6443bf0-011c-4bc2-b739-4a2e33e2a27b
  type:
    type: string
    description: Transaction type
    enum:
      - withdrawal
      - purchase
      - transfer
      - p2p
      - online_checkout
      - qrt_credit
      - qrt_debit
    example: transfer
  status:
    type: string
    description: >-
      Transaction status. `SUCCESS` means the transfer completed;
      `PENDING_BILLING` means it is still being processed.


      In addition, any undocumented `data.status` should be treated as
      `PENDING_BILLING`; listen for the webhook or requery the transaction for
      its final status.
    enum:
      - SUCCESS
      - PENDING_BILLING
    example: SUCCESS
required:
  - amount
  - meta
  - fee
  - timeCreated
  - id
  - type
  - status
description: Transfer data
