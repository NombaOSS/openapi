type: object
properties:
  customerAccountNumber:
    type: string
    example: '0174534423'
  bankCode:
    type: string
    example: '101'
  customerName:
    type: string
    example: Kolapo Ojo
  customerAddress:
    type: string
    example: maryland Ikeja computer village
  customerAccountName:
    type: string
    example: Kolapo Ojo
  amount:
    type: number
    format: double
    example: 100
  frequency:
    type: string
    enum:
      - VARIABLE
      - WEEKLY
      - EVERY_TWO_WEEKS
      - MONTHLY
      - EVERY_TWO_MONTHS
      - EVERY_THREE_MONTHS
      - EVERY_FOUR_MONTHS
      - EVERY_FIVE_MONTHS
      - EVERY_SIX_MONTHS
      - EVERY_SEVEN_MONTHS
      - EVERY_EIGHT_MONTHS
      - EVERY_NINE_MONTHS
      - EVERY_TEN_MONTHS
      - EVERY_ELEVEN_MONTHS
      - EVERY_TWELVE_MONTHS
    example: WEEKLY
  narration:
    type: string
    example: test e mandate response
  customerPhoneNumber:
    type: string
    example: '0807882343'
  merchantReference:
    type: string
    description: >-
      A NUMERIC string (0-9) used to track a transaction. It must be unique per
      transaction.
    example: '120030740017'
  startDate:
    type: string
    format: date-time
    example: 2025-08-29T14:58
  endDate:
    type: string
    format: date-time
    example: 2025-08-30T10:40
  customerEmail:
    type: string
    example: kolapo@gmail.com
  startImmediately:
    type: boolean
    example: true
required:
  - customerAccountNumber
  - bankCode
  - customerName
  - customerAccountName
  - amount
  - frequency
  - merchantReference
  - startDate
  - endDate
  - customerEmail
