type: object
properties:
  accountRef:
    type: string
    description: Account reference
    minLength: 16
    maxLength: 64
    example: 1oWbJQQHLyQqqf1SwxjSpudeA21
  accountName:
    type: string
    description: Account holder's name
    minLength: 8
    maxLength: 64
    example: Daniel Scorsese
  bvn:
    type: string
    description: Account holder's BVN. Optional.
    example: '12345678'
  nin:
    type: string
    description: |-
      Account holder's National Identification Number (NIN). Optional.
       Must be exactly 11 digits. Can be sent on its own or alongside `bvn`. If neither is sent, the BVN on the parent business account is used.
    minLength: 11
    maxLength: 11
    pattern: ^\d{11}$
    example: '12345678901'
  expiryDate:
    type: string
    description: Account expiry date in UTC. Optional. ⚠️Be careful with this.
    example: '2026-01-30 12:15:00'
  expectedAmount:
    type: number
    format: double
    description: Amount the account can receive. Optional.
    example: '200.00'
  restrictInflowToAccountName:
    type: boolean
    description: >-
      When set to true, Nomba will reject any inflow to the virtual account
      whose sender name does not match the virtual account name. The order of
      names does not matter—for example, a VA name of 'John Doe Naomi' would
      match sender names like 'Doe John Naomi' or 'Naomi Doe John', since
      different banks may arrange names differently. A `payment_failed` webhook
      event is sent to notify the merchant that the inflow was rejected. The
      rejected inflow is reversed back to the sender according to the sending
      bank's policy. Optional.
    example: true
  callbackUrl:
    type: string
    format: uri
    description: >-
      URL to receive `payment_success` and `payment_failed` webhook events for
      inflows into this virtual account. Optional.
    example: https://merchant.example.com/webhooks/nomba
required:
  - accountRef
  - accountName
