type: object
properties:
  createdAt:
    type: string
    description: Creation timestamp
    format: date-time
    example: '2023-09-04T07:09:06.900Z'
  accountHolderId:
    type: string
    description: Account holder ID
    minLength: 36
    maxLength: 36
    example: 01a10aeb-d989-460a-bbde-9842f2b4320f
  accountRef:
    type: string
    description: Account reference
    minLength: 16
    maxLength: 64
    example: 1oWbJQQHLyQqqf1SwxjSpudeA21
  bvn:
    type: string
    description: Bank Verification Number (BVN)
    minLength: 11
    maxLength: 11
    example: '12234412345'
  identifierType:
    type: string
    description: >-
      The type of identifier the virtual account was created against. Omitted
      when the account has no identifier.
    enum:
      - BVN
      - NIN
      - BVN_AND_NIN
    example: BVN
  accountName:
    type: string
    description: Account holder's name
    minLength: 8
    maxLength: 64
    example: Daniel Scorsese
  bankName:
    type: string
    description: Bank name
    example: Nombank MFB
  bankAccountNumber:
    type: string
    description: Bank account number
    example: '9391076543'
  bankAccountName:
    type: string
    description: Bank account holder name
    example: Nomba/Ifeoluwa Adeboye
  currency:
    type: string
    description: Currency code
    minLength: 3
    maxLength: 3
    enum:
      - NGN
    example: NGN
  callbackUrl:
    type: string
    description: Callback url
    format: url
    example: https://webhook.site/98ef100f-5adc-4434-800a-0808h60bd8d7
  expired:
    type: boolean
    description: Successfully updated
    example: true
  restrictInflowToAccountName:
    type: boolean
    description: >-
      Indicates whether inflow restriction by account name is enabled. When
      true, the virtual account was successfully created with name restriction,
      meaning inflows will only be accepted if the sender's name matches the
      account name.
    example: true
required:
  - createdAt
  - accountId
  - accountHolderId
  - accountRef
  - bvn
  - status
  - type
  - accountName
  - banks
  - currency
