type: object
properties:
  productId:
    type: string
    description: >-
      The unique identifier of the data plan to purchase — returned as
      `productId` by the Fetch Data Plans endpoint. Required for all new
      integrations: it resolves to an exact plan and amount, removing any
      ambiguity when multiple plans on the same network share the same price.
    example: mtn47
  amount:
    type: number
    format: double
    description: >-
      **Deprecated — do not use.** `amount` is a legacy-only field with no
      guarantee of correctness: multiple plans can share the same price, so it
      cannot reliably identify the bundle you want. Use `productId` — the only
      supported way to select a plan.
    deprecated: true
  phoneNumber:
    type: string
    description: Recipient phone number
    minLength: 11
    maxLength: 13
    example: '08055441122'
  network:
    type: string
    description: >-
      Recipient network (telco). It can also come as lowercased values e.g. glo,
      mtn etc.
    minLength: 3
    enum:
      - GLO
      - MTN
      - 9MOBILE
      - AIRTEL
    example: GLO
  merchantTxRef:
    type: string
    description: Merchant Transaction Identifier reference (Unique to merchant)
    example: 3bvwhibh38220dsjakTwvb
  senderName:
    type: string
    description: A name to describe the sender of the data
    example: John Doe
required:
  - productId
  - phoneNumber
  - network
  - merchantTxRef
