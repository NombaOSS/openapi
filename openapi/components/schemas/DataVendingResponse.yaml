type: object
properties:
  amount:
    type: number
    format: double
    description: The amount charged for this data purchase.
    example: 200
  productId:
    type: string
    description: The identifier of the data plan that was vended.
    example: mtn47
  plan:
    type: string
    description: >-
      A human-readable description of the exact data bundle that was vended
      (size and validity).
    example: 3.5GB Daily Plan
  timeCreated:
    type: string
    description: The Date and Time of transaction creation
    format: date-time
    example: '2023-09-04T07:09:06.900Z'
  type:
    type: string
    description: The classification for this type of transaction
    example: topup
  meta:
    type: object
    description: Extra information about this transaction
    example:
      merchantTxRef: test1116
      rrn: '240626232937'
  status:
    type: string
    description: >-
      The status of this transaction. `SUCCESS` means it completed; `PROCESSING`
      means it is still being processed — listen for the webhook or requery the
      transaction for the final status.
    enum:
      - SUCCESS
      - PROCESSING
    example: SUCCESS
  id:
    type: string
    description: >-
      The unique ID of the transaction, e.g.
      `API-DATA-AAA1A-36dc6c70-5cf2-4592-93be-9bccc23df7f5`. Use it to requery
      the transaction.
    example: API-DATA-AAA1A-36dc6c70-5cf2-4592-93be-9bccc23df7f5
required:
  - amount
  - timeCreated
  - type
  - status
