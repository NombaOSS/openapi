type: object
properties:
  disco:
    type: string
    example: jed
  merchantTxRef:
    type: string
    description: This is an idempotency key and must be unique per transaction.
    example: '12345'
  payerName:
    type: string
    example: John Doe
  amount:
    type: integer
    example: 1000
  customerId:
    type: string
    example: customer123
  meterType:
    type: string
    example: prepaid
