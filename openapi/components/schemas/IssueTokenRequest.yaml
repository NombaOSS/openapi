type: object
description: A structure representing an authentication request.
properties:
  grant_type:
    type: string
    description: The grant type of the authentication.
    enum:
      - client_credentials
      - refresh_token
    example: client_credentials
  client_id:
    type: string
    description: The client's id as obtained from your Nomba dashboard.
    example: 2242b79d-f2cf-4ccc-ada1-e890bd1a9f0d
    maxLength: 36
    minLength: 36
  client_secret:
    type: string
    description: >-
      The client's secret as obtained from your Nomba dashboard. It is securely
      generated by the Nomba system
    example: JFJ8yq3G4+DvjivJMsji0YkZBkkKdSdjifR+TgT9RLM=
    maxLength: 44
    minLength: 44
required:
  - grant_type
  - client_id
  - client_secret
