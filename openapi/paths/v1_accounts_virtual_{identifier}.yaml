put:
  tags:
    - Virtual Accounts
  summary: Update a virtual account
  description: You can use this endpoint to update a virtual account.
  operationId: Update a virtual account
  parameters:
    - description: The parent accountId of the business.
      in: header
      name: accountId
      schema:
        type: string
        format: uuid
        example: 890022ce-bae0-45c1-9b9d-ee7872e6ca27
      required: true
    - description: >-
        The account reference or 10 digit Virtual account number of the VA to be
        updated.
      example: INVOICE-20230823-0000 or 0107841806
      in: path
      name: identifier
      required: true
      schema:
        type: string
        example: INVOICE-20230823-0000 or 0107841806
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateVirtualAccountRequest.yaml
    description: |-
      The request payload required to update a virtual account. 
       Please note that it might take a few seconds for the update to reflect in other banks depending on the bank's notification system.
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: '00'
                description: Response Code
              description:
                type: string
                example: Success
                description: Response description
              data:
                $ref: ../components/schemas/UpdateVirtualAccountResponse.yaml
            required:
              - code
              - description
              - data
      description: OK - your request was successful.
      headers:
