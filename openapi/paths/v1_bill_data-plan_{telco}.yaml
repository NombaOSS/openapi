get:
  tags:
    - Airtime and Data Vending
  summary: Fetch data plans available on a telco (network provider)
  description: >-
    You can use this endpoint to fetch data plans available on a telco (network
    provider)
  operationId: Fetch data plans available on a telco (network provider)
  parameters:
    - description: Network provider
      example: glo
      in: path
      name: telco
      required: true
      schema:
        type: string
    - description: The parent accountId of the business.
      in: header
      name: accountId
      schema:
        type: string
        format: uuid
        example: 890022ce-bae0-45c1-9b9d-ee7872e6ca27
      required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: '00'
                description: Response Code
              description:
                type: string
                example: SUCCESS
                description: Response description
              message:
                type: string
                example: SUCCESS
                description: Response message
              status:
                type: boolean
                example: true
                description: Request status
              data:
                $ref: ../components/schemas/DataPlanList.yaml
            required:
              - code
              - description
              - message
              - status
              - data
          example:
            code: '00'
            description: SUCCESS
            message: SUCCESS
            status: true
            data:
              - plan: 110MB Daily Plan
                amount: 100
                productId: mtn1
              - plan: 1GB + 1.5mins 1 day Plan
                amount: 500
                productId: mtn16
              - plan: 2.7GB+5mins Monthly Plan
                amount: 2000
                productId: mtn6
              - plan: 7GB Monthly Plan
                amount: 3500
                productId: mtn30
              - plan: 20GB Monthly Plan - 30days
                amount: 7500
                productId: mtn5
      description: OK - your request was successful.
      headers:
        X-Rate-Limit-Limit:
          description: The number of allowed requests in the current period
          schema:
            type: string
            example: '40'
        X-Rate-Limit-Remaining:
          description: The number of remaining requests in the current period
          schema:
            type: string
            example: '39'
        X-Rate-Limit-Window:
          description: The specified rate limit window
          schema:
            type: string
            example: 1s
    '400':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RequestError.yaml
      description: The request body sent by merchant did not pass the validation checks
    '401':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthenticationError.yaml
      description: The access_token provided to access the resource is missing or invalid.
    '403':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthorizationError.yaml
      description: The client does not have the permissions to access this resource
    '404':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RecordNotFoundError.yaml
      description: The record that the client is trying to access does not exist.
    '429':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RateLimitError.yaml
      description: >-
        The client has maxed out the number of calls within a time period on
        this resource.
    '500':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServerError.yaml
      description: Downstream system error.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RequestError.yaml
      description: Resource not available
  security:
    - BearerAuth: []
