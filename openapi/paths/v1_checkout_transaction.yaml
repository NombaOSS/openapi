get:
  tags:
    - Online Checkout
  summary: Fetch checkout transaction
  description: Fetch checkout transaction
  operationId: Fetch a checkout transaction
  parameters:
    - description: The parent accountId of the business.
      in: header
      name: accountId
      schema:
        type: string
        format: uuid
        example: 890022ce-bae0-45c1-9b9d-ee7872e6ca27
      required: true
    - description: >-
        Checkout id type to use for this query. Valid values are the
        'ORDER_REFERENCE', to use Order reference passed in when generating the
        checkout link, and 'ORDER_ID' to use the uuid value returned in the
        checkout link path.
      example: ORDER_ID
      in: query
      name: idType
      schema:
        type: string
        enum:
          - ORDER_ID
          - ORDER_REFERENCE
    - description: >-
        Checkout transaction id based on the value selected in the idType
        parameter
      example: 120022e-e6ca27-33ed-ee7872e6ca27
      in: query
      name: id
      schema:
        type: string
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: '00'
                description: Response Code
              description:
                type: string
                example: Success
                description: response description
              data:
                $ref: ../components/schemas/CheckoutTransaction.yaml
      description: OK - your request was successful.
      headers:
        X-Rate-Limit-Limit:
          description: The number of allowed requests in the current period
          schema:
            type: string
            example: '40'
        X-Rate-Limit-Remaining:
          description: The number of remaining requests in the current period
          schema:
            type: string
            example: '39'
        X-Rate-Limit-Window:
          description: The specified rate limit window
          schema:
            type: string
            example: 1s
    '400':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RequestError.yaml
      description: The request body sent by merchant did not pass the validation checks
    '401':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthenticationError.yaml
      description: The access_token provided to access the resource is missing or invalid.
    '403':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthorizationError.yaml
      description: The client does not have the permissions to access this resource
    '404':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RecordNotFoundError.yaml
      description: The record that the client is trying to access does not exist.
    '429':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RateLimitError.yaml
      description: >-
        The client has maxed out the number of calls within a time period on
        this resource.
    '500':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServerError.yaml
      description: Downstream system error.
  security:
    - BearerAuth: []
