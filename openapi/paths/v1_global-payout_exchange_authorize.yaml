post:
  description: Transfer funds between your own accounts in different currencies.
  operationId: Authorize Exchange
  parameters:
    - description: Bearer token for authentication.
      in: header
      name: Authorization
      schema:
        type: string
        example: Bearer <token>
      required: true
    - description: The parent accountId of the business.
      in: header
      name: accountId
      schema:
        type: string
        example: 890022ce-bae0-45c1-9b9d-ee7872e6ca27
      required: true
  requestBody:
    required: true
    description: Exchange authorization payload
    content:
      application/json:
        schema:
          type: object
          required:
            - amount
            - sourceCurrency
            - destinationCurrency
            - senderName
            - receiverName
            - sourceCountryIsoCode
            - destinationCountryIsoCode
          properties:
            amount:
              type: number
              example: 1
            sourceCurrency:
              type: string
              example: USD
            destinationCurrency:
              type: string
              example: CDF
            senderName:
              type: string
              example: John Doe
            receiverName:
              type: string
              example: John Doe
            sourceCountryIsoCode:
              type: string
              example: CD
            destinationCountryIsoCode:
              type: string
              example: CD
            narration:
              type: string
              example: Transfer between my accounts
            lockedExchangeRateId:
              type: string
              example: 01kkk4b7rh8pcvtw1s1nxs144s
              description: >-
                The exchangeRateId from a prior Fetch Exchange Rates call. When
                provided, the exchange is fulfilled at that exact rate.
            idempotencyKey:
              type: string
              maxLength: 128
              example: 5e246f9a-3e79-4b11-92f1-dbd98b53b308
              description: >-
                Optional. Your own unique key for this request. Send the same
                key when retrying and the original transaction is returned
                instead of a second one being created. A key stays tied to its
                transaction permanently — use a new key for a new attempt.
  responses:
    '200':
      description: Exchange authorized successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: '00'
              description:
                type: string
                example: Successful
              data:
                type: object
                properties:
                  wtTransactionId:
                    type: string
                    example: 01kkk8cjk0fpw9jx2n01wd8yfw
                  coreTransactionId:
                    type: string
                    example: API-P2P-CB9EC-0c2d962e-4730-48e7-b522-d65cac511549
                  status:
                    type: string
                    example: PROCESSING
                  coreStatus:
                    type: string
                    example: SUCCESS
                  type:
                    type: string
                    example: EXCHANGE
                  idempotencyKey:
                    type: string
                    example: 5e246f9a-3e79-4b11-92f1-dbd98b53b308
                    description: >-
                      The idempotencyKey you sent, echoed back. Empty if you did
                      not send one.
                  idempotentReplay:
                    type: boolean
                    example: false
                    description: >-
                      True when this response is a replay of an earlier request
                      with the same key, meaning nothing new was created.
