get:
  description: >-
    Sandbox version of Fetch Global Payout Account. Returns canned account
    details and balance for the given account ID, for use in testing.
  operationId: Fetch Global Payout Account (Sandbox)
  parameters:
    - description: Bearer token for authentication.
      in: header
      name: Authorization
      schema:
        type: string
        example: Bearer <token>
      required: true
    - description: The parent accountId of the business.
      in: header
      name: accountId
      schema:
        type: string
        example: 890022ce-bae0-45c1-9b9d-ee7872e6ca27
      required: true
    - name: accountId
      in: path
      required: true
      description: >-
        The wallet id, exactly as returned in the accountId field by GET
        /v1/sandbox/global-payout/accounts. Any value is accepted in sandbox and
        is echoed back in the response.
      schema:
        type: string
        example: sandbox-acc-cad-001
  responses:
    '200':
      description: Account retrieved successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: '00'
              description:
                type: string
                example: Success
              status:
                type: boolean
                description: >-
                  Legacy envelope flag. Global Payout endpoints leave it false
                  even on success - read code instead, where 00 means success.
                example: false
              data:
                type: object
                properties:
                  accountId:
                    type: string
                    example: sandbox-acc-cad-001
                  name:
                    type: string
                    example: Sandbox CAD Account
                  currency:
                    type: string
                    example: CAD
                  balance:
                    type: number
                    nullable: true
                    description: >-
                      Everything the wallet holds, liens included. Null when the
                      balance could not be read - see status.
                    example: 1250.5
                  availableBalance:
                    type: number
                    nullable: true
                    description: >-
                      The balance less anything held under lien: what can
                      actually be paid out. Null when the balance could not be
                      read - see status.
                    example: 1000.5
                  status:
                    type: string
                    enum:
                      - ACTIVE
                      - UNAVAILABLE
                    description: >-
                      ACTIVE when the balances are good. UNAVAILABLE means you
                      hold the account but its balance could not be read on this
                      request, and both balance fields are null.
                    example: ACTIVE
                  operationRegion:
                    type: string
                    example: GLOBAL
