post:
  tags:
    - Terminals
  summary: Un-assign terminal from a sub account
  description: You can use this endpoint to un-assign a terminal from a sub account.
  operationId: Un-assign terminal from an account
  parameters:
    - description: The parent accountId of the business.
      in: header
      name: accountId
      schema:
        type: string
        format: uuid
        example: 890022ce-bae0-45c1-9b9d-ee7872e6ca27
      required: true
    - description: The sub accountId of the business.
      example: 2242b79d-f2cf-4ccc-ada1-e890bd1a9f0d
      in: path
      name: subAccountId
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/TerminalAssignmentRequest.yaml
    description: The request payload required to un-assign a terminal from a sub account
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: '00'
                description: Response Code
              description:
                type: string
                example: Success
                description: Response description
              data:
                $ref: ../components/schemas/TerminalResult.yaml
            required:
              - code
              - description
              - data
      description: OK - your request was successful.
      headers:
        X-Rate-Limit-Limit:
          description: The number of allowed requests in the current period
          schema:
            type: string
            example: '40'
        X-Rate-Limit-Remaining:
          description: The number of remaining requests in the current period
          schema:
            type: string
            example: '39'
        X-Rate-Limit-Window:
          description: The specified rate limit window
          schema:
            type: string
            example: 1s
    '400':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RequestError.yaml
      description: The request body sent by merchant did not pass the validation checks
    '401':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthenticationError.yaml
      description: The access_token provided to access the resource is missing or invalid.
    '403':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthorizationError.yaml
      description: The client does not have the permissions to access this resource
    '404':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RecordNotFoundError.yaml
      description: The record that the client is trying to access does not exist.
    '429':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RateLimitError.yaml
      description: >-
        The client has maxed out the number of calls within a time period on
        this resource.
    '500':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServerError.yaml
      description: Downstream system error.
  security:
    - BearerAuth: []
