post:
  tags:
    - Airtime and Data Vending
  summary: Make airtime purchases via sub account
  description: You can use this endpoint to make airtime purchases via a sub account
  operationId: Make airtime purchases via specific or sub account v2
  parameters:
    - description: The parent accountId of the business this sub account belongs to
      in: header
      name: accountId
      schema:
        type: string
        format: uuid
        example: 890022ce-bae0-45c1-9b9d-ee7872e6ca27
      required: true
    - description: The sub accountId via which airtime is to be purchased
      in: path
      name: subAccountId
      schema:
        type: string
        format: uuid
        example: 890022ce-bae0-45c1-9b9d-ee7872e6ca27
      required: true
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AirtimePurchaseRequest.yaml
    description: The request payload required to make airtime purchases
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                description: >-
                  Response code. This reflects the HTTP status code of the
                  response, e.g. `200` when the request completed successfully
                  and `201` when it was accepted and is still being processed.
                example: '200'
                enum:
                  - '200'
                  - '201'
                  - '400'
                  - '401'
                  - '403'
                  - '429'
                  - '500'
              description:
                type: string
                example: SUCCESS
                description: Response description
              message:
                type: string
                description: Response message
                example: Transaction completed Successfully
              status:
                type: boolean
                description: Whether the request was successful
                example: true
              data:
                $ref: ../components/schemas/AirtimePurchaseV2Response.yaml
            required:
              - code
              - description
              - data
          example:
            code: '200'
            description: SUCCESS
            message: Transaction completed Successfully
            status: true
            data:
