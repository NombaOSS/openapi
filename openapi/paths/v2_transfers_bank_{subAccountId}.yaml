post:
  tags:
    - Transfers
  summary: Perform bank account transfer from the sub account
  description: >-
    You can use this endpoint to perform bank account transfer using a sub
    account. 
     To use this, please reach out to us to profile you for sub account transfer.
  operationId: Perform bank account transfer from account
  parameters:
    - description: The parent accountId of the business.
      in: header
      name: accountId
      schema:
        type: string
        format: uuid
        example: 890022ce-bae0-45c1-9b9d-ee7872e6ca27
      required: true
    - description: The sub accountId to transfer from.
      example: 2242b79d-f2cf-4ccc-ada1-e890bd1a9f0d
      in: path
      name: subAccountId
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BankAccountTransferRequest.yaml
    description: The request payload required to perform bank account transfer.
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                description: >-
                  Response code. This reflects the HTTP status code of the
                  response, e.g. `200` when the request completed successfully
                  and `201` when it was accepted and is still being processed.
                example: '200'
                enum:
                  - '200'
                  - '201'
                  - '400'
                  - '401'
                  - '403'
                  - '429'
                  - '500'
              description:
                type: string
                example: Success
                description: Response description
              data:
                $ref: ../components/schemas/BankAccountTransferResult.yaml
            required:
              - code
              - description
              - data
      description: OK - your request was successful.
      headers:
        X-Rate-Limit-Limit:
          description: The number of allowed requests in the current period
          schema:
            type: string
            example: '40'
        X-Rate-Limit-Remaining:
          description: The number of remaining requests in the current period
          schema:
            type: string
            example: '39'
        X-Rate-Limit-Window:
          description: The specified rate limit window
          schema:
            type: string
            example: 1s
    '201':
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                description: >-
                  Response code. This reflects the HTTP status code of the
                  response, e.g. `200` when the request completed successfully
                  and `201` when it was accepted and is still being processed.
                example: '201'
                enum:
                  - '200'
                  - '201'
                  - '400'
                  - '401'
                  - '403'
                  - '429'
                  - '500'
              description:
                type: string
                example: PROCESSING
              message:
                type: string
                example: Unable to process response, please rely on web hook
              status:
                type: boolean
                example: false
              data:
                type: object
                properties:
                  status:
                    type: string
                    description: >-
                      Status of the transfer. `PENDING_BILLING` means it is
                      still being processed.


                      In addition, any undocumented `data.status` should be
                      treated as `PENDING_BILLING`; listen for the webhook or
                      requery the transaction for its final status.
                    example: PENDING_BILLING
      description: >-
        Transfer is being processed — the final status will be delivered via
        webhook. Mark the transaction as pending and do not retry with a new
        reference.
    '400':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RequestError.yaml
      description: The request body sent by merchant did not pass the validation checks
    '401':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthenticationError.yaml
      description: The access_token provided to access the resource is missing or invalid.
    '403':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthorizationError.yaml
      description: The client does not have the permissions to access this resource
    '404':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RecordNotFoundError.yaml
      description: The record that the client is trying to access does not exist.
    '429':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RateLimitError.yaml
      description: >-
        The client has maxed out the number of calls within a time period on
        this resource.
    '500':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServerError.yaml
      description: Downstream system error.
  security:
    - BearerAuth: []
