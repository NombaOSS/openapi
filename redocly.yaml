# Known problems inherited from the docs are listed in .redocly.lint-ignore.yaml
# (see ALIGNMENT.md). Remove entries as they are fixed upstream; CI fails on any
# new problem.
extends:
  - recommended

apis:
  nomba:
    root: openapi/openapi.yaml
    # Applied to the bundled spec only, so openapi/ stays a copy of the docs.
    # The docs title this "Vendor API" with no description.
    decorators:
      info-override:
        title: Nomba API
        description: >-
          Accounts, virtual accounts, checkout, transfers, direct debits,
          terminals, transactions and bill payments. Generated from
          https://developer.nomba.com.
        contact:
          name: Nomba Developers
          url: https://developer.nomba.com
          email: docs@nomba.com
        license:
          name: MIT
          url: https://opensource.org/licenses/MIT
